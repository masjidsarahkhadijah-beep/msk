<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MSKmobile</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
    <style>
        :root { 
            --navy: #004282; 
            --sky-blue: #87CEEB; 
            --bg: #ffffff; 
            --accent: #0ea5e9;
        }
        * { box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: var(--navy); margin: 0; padding: 0; overflow: hidden; }
        .container { max-width: 500px; margin: auto; background: var(--bg); height: 100vh; display: flex; flex-direction: column; position: relative; }

        .running-text { background: #ffd700; color: #000; font-size: 11px; font-weight: 700; padding: 5px 0; border-bottom: 1px solid rgba(0,0,0,0.1); }

        /* --- LOGIN --- */
        #loginSection { height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; background: var(--navy); padding: 20px; z-index: 1000; position: absolute; width: 100%; top: 0; }
        .login-card { background: white; width: 100%; max-width: 320px; padding: 40px 25px; border-radius: 35px; text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.3); }
        
        /* --- HEADER --- */
        .header { background: var(--navy); color: white; padding: 20px 15px; text-align: center; border-bottom: 4px solid var(--sky-blue); flex-shrink: 0; position: relative; display: flex; justify-content: center; align-items: center; }
        .header h3 { margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -1px; }
        .logout-btn { position: absolute; right: 15px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.3); color: white; padding: 5px 10px; border-radius: 12px; font-size: 10px; font-weight: 700; cursor: pointer; }

        /* --- CONTENT --- */
        .card-container { flex: 1; padding: 15px; overflow-y: auto; padding-bottom: 100px; }
        .item-card { background: white; margin-bottom: 15px; border-radius: 20px; padding: 20px; border-left: 8px solid var(--accent); box-shadow: 0 8px 20px rgba(0,0,0,0.06); }
        .card-label { font-size: 10px; color: var(--accent); font-weight: 700; text-transform: uppercase; margin-bottom: 5px; display: block; }
        .card-title { font-size: 16px; color: #1e293b; font-weight: 600; line-height: 1.4; margin-bottom: 10px; }
        .card-amount { font-size: 18px; color: #e11d48; font-weight: 700; padding-top: 10px; border-top: 1px dashed #e2e8f0; display: flex; justify-content: space-between; align-items: center; }

        /* --- KARTU KEGIATAN (GRADASI MEWAH) --- */
        .undangan-card { 
            background: linear-gradient(135deg, #DD8819 0%, #800505 100%); 
            border-radius: 25px; margin-bottom: 25px; padding: 35px 25px; 
            border: 4px solid #ffffff; /* Bingkai Putih */
            text-align: center; position: relative; 
            box-shadow: 0 15px 30px rgba(128,5,5,0.25);
            color: white; /* Semua teks jadi putih */
        }
        .undangan-tag { font-size: 10px; font-weight: 700; color: #ffd700; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 8px; display: block; }
        .undangan-title { font-family: 'Playfair Display', serif; font-size: 26px; color: #ffffff; margin-bottom: 10px; font-weight: 700; }
        .undangan-body { font-family: 'Playfair Display', serif; font-style: italic; font-size: 16px; color: #f8fafc; line-height: 1.6; }

        /* --- TAKJIL STYLES --- */
        .dalil-box { text-align:center; padding:20px; background:#fff9eb; border-radius:20px; border:2px dashed #f59e0b; margin-bottom:20px; font-size:12px; font-style:italic; color:#92400e; }
        .search-area { background: var(--sky-blue); padding: 15px; border-radius: 20px; margin-bottom: 20px; }

        /* --- NAVIGASI --- */
        .nav { background: white; display: flex; padding: 10px; border-top: 1px solid #e2e8f0; position: fixed; bottom: 0; width: 100%; max-width: 500px; justify-content: space-around; }
        .nav-item { flex: 1; text-align: center; font-size: 9px; color: #cbd5e1; cursor: pointer; font-weight: 600; }
        .nav-item.active { color: var(--accent); }
        .nav-item span { display: block; font-size: 22px; margin-bottom: 4px; }
        
        .custom-input { width: 100%; padding: 14px; border: 2px solid #e2e8f0; border-radius: 18px; text-align: center; font-size: 16px; outline: none; margin-top: 15px; }
        .btn-main { width: 100%; padding: 15px; background: var(--navy); color: white; border: none; border-radius: 18px; font-weight: bold; cursor: pointer; margin-top: 20px; }
    </style>
</head>
<body>

<div class="container">
    <div id="loginSection">
        <img src="https://i.postimg.cc/j5VGx6D1/IMG-20220407-WA0007(1).jpg" style="width: 100px; height: auto; margin-bottom: 20px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.2);">
        <div class="login-card">
            <h2 style="color:var(--navy); margin:0; font-size: 32px;">MSKmobile</h2>
            <div style="font-size:10px; color:#94a3b8; text-transform:uppercase; letter-spacing:2px; margin-top:5px;">Dibuat oleh Kominpo MSK</div>
            <input type="password" id="pinInput" class="custom-input" placeholder="Kode Akses">
            <button class="btn-main" onclick="prosesMasuk()">MASUK</button>
        </div>
        <div style="margin-top: 25px; text-align: center;">
            <div style="font-size: 28px; font-weight: 700; color: #ffd700; line-height: 1;">262</div>
            <div style="font-size: 10px; color: white; text-transform: uppercase; letter-spacing: 2px; opacity: 0.7;">Jama'ah Terdaftar</div>
        </div>
    </div>

    <div class="running-text">
        <marquee scrollamount="5">Selamat Datang di MSKmobile - Silahkan cek Informasi Keuangan, Jadwal Kajian, dan Daftar Takjil secara berkala.</marquee>
    </div>

    <div class="header">
        <h3>MSKmobile</h3>
        <button class="logout-btn" onclick="logout()">KELUAR</button>
    </div>
    
    <div class="card-container" id="displayArea"></div>

    <nav class="nav">
        <div class="nav-item active" onclick="muatKeuangan('1hO_YdzN_95raKhGPRNTGMcBYJ_WPWhKx23SPXb7ezT8', this)"><span>💰</span>KEUANGAN</div>
        <div class="nav-item" onclick="tampilanTakjil(this)"><span>🌙</span>TAKJIL</div>
        <div class="nav-item" onclick="muatStruktur('1LqjjHNTAPR55uworU0CJLYKLfLCjb9yKsGN3WmMz8Ak', this)"><span>👥</span>STRUKTUR</div>
        <div class="nav-item" onclick="muatKegiatan(this)"><span>🕌</span>KEGIATAN</div>
    </nav>
</div>

<script>
    let cacheTakjil = [];

    function prosesMasuk() {
        if(document.getElementById('pinInput').value === 'msk2026') {
            document.getElementById('loginSection').style.display = 'none';
            muatKeuangan('1hO_YdzN_95raKhGPRNTGMcBYJ_WPWhKx23SPXb7ezT8', document.querySelector('.nav-item'));
        } else { alert("Akses Ditolak!"); }
    }

    function logout() {
        if(confirm("Apakah Anda ingin keluar?")) {
            document.getElementById('pinInput').value = "";
            document.getElementById('loginSection').style.display = 'flex';
        }
    }

    function formatTgl(raw) {
        if(!raw || String(raw).includes("1899")) return "";
        let dateParts = String(raw).match(/\d+/g);
        if(!dateParts) return raw;
        let tahun = dateParts[0];
        let bulanIndex = parseInt(dateParts[1]);
        let tanggal = dateParts[2];
        const namaBulan = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];
        return `${tanggal} ${namaBulan[bulanIndex]} ${tahun}`;
    }

    function muatKeuangan(id, el) {
        setTheme('#0ea5e9', el);
        const area = document.getElementById('displayArea');
        area.innerHTML = '<div style="text-align:center; padding-top:50px;">Memuat Data...</div>';
        const cb = 'cb_fin_' + Date.now();
        window[cb] = function(d) {
            let html = `<div style="background: var(--navy); color: white; padding: 20px; border-radius: 20px; margin-bottom: 20px; text-align:center; font-weight:bold;">INFORMASI KEUANGAN</div>`;
            d.table.rows.forEach(r => {
                if(r.c && r.c[1]) {
                    let label = r.c[1].v;
                    let nilai = r.c[2] ? (r.c[2].f || r.c[2].v) : '0';
                    html += `<div class="item-card"><span class="card-label">Rincian</span><div class="card-title">${label}</div><div class="card-amount">Rp ${nilai}</div></div>`;
                }
            });
            area.innerHTML = html;
        };
        fetchJS(id, cb);
    }

    function muatStruktur(id, el) {
        setTheme('#3b82f6', el);
        const area = document.getElementById('displayArea');
        area.innerHTML = '<div style="text-align:center; padding-top:50px;">Memuat Struktur...</div>';
        const cb = 'cb_str_' + Date.now();
        window[cb] = function(d) {
            let h = '';
            d.table.rows.forEach(r => {
                if(r.c && r.c[1]) {
                    let jab = r.c[0] ? r.c[0].v : '-';
                    let nama = r.c[1] ? String(r.c[1].v).replace(/\n/g, '<br>') : '---';
                    let ket = r.c[2] ? r.c[2].v : '';
                    h += `<div class="item-card"><span class="card-label">${jab}</span><div class="card-title">${nama}</div>${ket ? `<div style="font-size:12px; color:#64748b;">${ket}</div>` : ''}</div>`;
                }
            });
            area.innerHTML = h;
        };
        fetchJS(id, cb);
    }

    function muatKegiatan(el) {
        setTheme('#14b8a6', el);
        const area = document.getElementById('displayArea');
        area.innerHTML = '<div style="text-align:center; padding-top:50px;">Memuat Jadwal...</div>';
        const idSheet = '1Cumo-ZZpqClTGJpGOo0QoOuHrp--AX2rLFJReJpJIJM'; 
        const cb = 'cb_keg_' + Date.now();
        window[cb] = function(d) {
            let h = '';
            d.table.rows.forEach(r => { 
                if(r.c && r.c[0]) { 
                    let judul = r.c[0].v;
                    let tgl = r.c[1] ? formatTgl(r.c[1].v) : '';
                    let tmpt = r.c[2] ? r.c[2].v : ''; 
                    let jam = r.c[3] ? r.c[3].v : '';
                    let ustad = r.c[4] ? r.c[4].v : '';
                    h += `<div class="undangan-card"><span class="undangan-tag">${tgl}</span><div class="undangan-title">${judul}</div><div class="undangan-body">${jam ? '🕒 ' + jam + '<br>' : ''}🕌 ${tmpt}${ustad ? '<br><span style="color:#ffd700; font-weight:700;">🎙️ Ust: ' + ustad + '</span>' : ''}</div></div>`;
                } 
            });
            area.innerHTML = h || '<p style="text-align:center;">Belum ada jadwal.</p>';
        };
        fetchJS(idSheet, cb);
    }

    function tampilanTakjil(el) {
        setTheme('#f59e0b', el);
        document.getElementById('displayArea').innerHTML = `
            <div class="dalil-box">"Barang siapa memberi makan orang yang berpuasa, maka baginya pahala seperti orang yang berpuasa tersebut tanpa mengurangi pahalanya sedikit pun.” (HR. Tirmidzi, no. 807; Ibnu Majah, no. 1746; Ahmad. Hadits ini hasan shahih)"</div>
            <div class="search-area">
                <input type="text" id="takjilInp" class="custom-input" style="margin-top:0; background:white;" placeholder="Masukkan No. Rumah" onkeyup="cariTakjil(this.value)">
                <button class="btn-main" style="margin-top:10px;" onclick="cariTakjil(document.getElementById('takjilInp').value)">CEK JADWAL ANDA</button>
            </div>
            <div id="takjilRes">
                <div class="item-card" style="opacity:0.6; border-left:8px solid #cbd5e1;">
                    <span class="card-label">INFO JADWAL:</span>
                    <div class="card-title">Silahkan masukkan nomor rumah Anda.</div>
                </div>
            </div>`;
        const cb = 'cb_tkj_' + Date.now();
        window[cb] = function(d) { cacheTakjil = d.table; };
        fetchJS('1pByqHl8twhOJvKyx-wOXeH9N1P_142WR8rNpJ4LDzlg', cb);
    }

    function cariTakjil(v) {
        const res = document.getElementById('takjilRes');
        const k = v.replace(/\s+/g, '').toLowerCase();
        
        if(k.length < 1) { 
            res.innerHTML = `<div class="item-card" style="opacity:0.6; border-left:8px solid #cbd5e1;"><span class="card-label">INFO JADWAL:</span><div class="card-title">Silahkan masukkan nomor rumah Anda.</div></div>`; 
            return; 
        }
        if(!cacheTakjil || !cacheTakjil.rows) return;
        
        let rows = cacheTakjil.rows.filter(r => {
            if(!r.c || !r.c[0]) return false;
            let noRumahData = String(r.c[0].v).replace(/\s+/g, '').toLowerCase();
            return noRumahData.includes(k);
        });
        
        let h = '';
        rows.forEach(r => {
            const getTxt = (cell) => { if (!cell) return ''; return cell.f ? cell.f : String(cell.v); };
            let noRumah = getTxt(r.c[0]);
            let tglN = getTxt(r.c[1]);
            let tglM = getTxt(r.c[2]);
            let nama = getTxt(r.c[3]) || 'Warga MSK';
            h += `<div class="item-card"><span class="card-label">JADWAL ANDA:</span><div class="card-title" style="color:var(--navy); font-size:18px;">${nama}</div><div style="font-size:12px; color:#64748b;">Rumah No: ${noRumah}</div><div style="padding-top:10px; border-top:1px dashed #e2e8f0; margin-top:10px;"><div style="font-size:15px; color:#1e293b; font-weight:700;">📅 ${tglN}</div><div style="font-size:13px; color:#e11d48; font-style:italic;">🌙 ${tglM}</div></div></div>`;
        });
        res.innerHTML = h || '<p style="text-align:center; padding:20px; color:#94a3b8;">Nomor rumah tidak ditemukan.</p>';
    }

    function setTheme(c, el) {
        document.documentElement.style.setProperty('--accent', c);
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        el.classList.add('active');
    }

    function fetchJS(id, cb) {
        const s = document.createElement('script');
        s.src = `https://docs.google.com/spreadsheets/d/${id}/gviz/tq?tqx=responseHandler:${cb}&t=${new Date().getTime()}`;
        document.body.appendChild(s);
    }
</script>
</body>
</html>
